site_name: Ahmad's Notes
site_url: https://notes.beyondyou.my.id/
site_description: Working notes on cloud-native infrastructure — the quick things I look up, not read cover to cover.
site_author: Ahmad Nurhidayat
copyright: Copyright &copy; 2026 Ahmad Nurhidayat

repo_url: https://github.com/ahmadnurhidayat/notes
repo_name: ahmadnurhidayat/notes
edit_uri: edit/main/docs/

theme:
  name: material
  variant: modern
  language: en
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ahmadnurhidayat
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ahmad-nurhidayat
  homepage: https://ahmadnurhidayat.github.io

